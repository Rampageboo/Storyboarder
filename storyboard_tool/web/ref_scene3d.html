<!doctype html>
<html lang="en" data-theme="studio">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Segment</title>
    <script>
      (function () {
        var themes = ["studio", "cinema", "paper", "slate", "noir"];
        try {
          var stored = localStorage.getItem("storyboard_ui_theme") || "studio";
          if (themes.indexOf(stored) >= 0) document.documentElement.setAttribute("data-theme", stored);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "studio");
        }
      })();
    </script>
    <link rel="stylesheet" href="/static/themes.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/reference_media.css" />
    <link rel="stylesheet" href="/static/ref_scene3d_window.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three/three.module.js"
        }
      }
    </script>
  </head>
  <body class="rs-app">
    <div class="rs-layout">
      <aside id="rsReferencesPanel" class="rs-references-panel"></aside>
      <section class="rs-panel">
        <div class="rs-panel-header">
          <span>3D Segment</span>
          <span id="rsSceneMeta" class="rs-status">Loading…</span>
        </div>
        <div class="rs-panel-body">
          <div id="rsSceneRoot" class="rs-scene-root">
            <div id="rsSceneEmpty" class="rs-scene-empty" hidden>Select or import a GLB reference.</div>
          </div>
          <input id="rsAnimScrubber" class="rs-scrubber" type="range" min="0" max="0" step="0.001" value="0" aria-label="Animation time" />
          <div class="rs-segment-box">
            <div class="rs-segment-toolbar">
              <span class="rs-group-title">Board Segment</span>
              <button type="button" id="rsFitBoards">Match boards</button>
              <button type="button" id="rsResetStart">Reset start</button>
              <button type="button" id="rsApply" class="rs-primary">Apply to boards</button>
            </div>
            <div class="rs-segment-timeline" id="rsSegmentTimeline">
              <div class="rs-segment-rail"></div>
              <div id="rsSegmentLayer"></div>
              <div class="rs-segment-playhead" id="rsPlayhead"></div>
            </div>
            <div id="rsSegmentSummary" class="rs-segment-summary">Segments: none</div>
          </div>
          <div id="rsBoardMeta" class="rs-board-meta"></div>
        </div>
      </section>
    </div>
    <input
      id="rsReferenceFile"
      type="file"
      accept="image/*,video/*,.glb,.gltf,.png,.jpg,.jpeg,.tif,.tiff,.webp,.mp4,.mov,.webm,.mkv,.avi,.m4v"
      hidden
    />
    <div id="rsToast" class="rs-toast" hidden></div>
    <script src="/static/reference_media.js"></script>
    <script src="/static/reference_preview.js"></script>
    <script type="module" src="/static/reference_model_preview.js"></script>
    <script type="module" src="/static/ref_scene3d_window.js"></script>
  </body>
</html>
