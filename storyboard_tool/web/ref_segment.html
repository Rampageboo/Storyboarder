<!doctype html>
<html lang="en" data-theme="studio">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Segment</title>
    <script>
      (function () {
        var themes = ["studio", "cinema", "paper", "slate", "noir"];
        try {
          var stored = localStorage.getItem("storyboard_ui_theme") || "studio";
          if (themes.indexOf(stored) >= 0) document.documentElement.setAttribute("data-theme", stored);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "studio");
        }
      })();
    </script>
    <link rel="stylesheet" href="/static/themes.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/reference_media.css" />
    <link rel="stylesheet" href="/static/ref_segment_window.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three/three.module.js"
        }
      }
    </script>
  </head>
  <body class="rsg-app" data-mode="video">
    <div class="rsg-layout">
      <aside id="rsgReferencesPanel" class="rsg-references-panel"></aside>
      <section class="rsg-panel">
        <div class="rsg-panel-header">
          <span id="rsgPanelTitle">Segment</span>
          <span id="rsgMeta" class="rsg-status">Loading…</span>
        </div>
        <div class="rsg-panel-body">
          <div class="rsg-views">
            <div class="rsg-view rsg-view-video">
              <video id="rsgVideo" preload="metadata" playsinline></video>
              <div id="rsgVideoEmpty" class="rsg-empty" hidden>Select a reference video.</div>
            </div>
            <div class="rsg-view rsg-view-image">
              <img id="rsgImage" alt="" />
              <div id="rsgImageEmpty" class="rsg-empty" hidden>Select a reference image.</div>
            </div>
            <div class="rsg-view rsg-view-model">
              <div id="rsgSceneRoot" class="rsg-scene-root"></div>
              <div id="rsgSceneEmpty" class="rsg-empty" hidden>Select a reference GLB.</div>
            </div>
          </div>
          <input id="rsgMediaScrubber" class="rsg-scrubber" type="range" min="0" max="0" step="0.001" value="0" aria-label="Media progress" />
          <div class="rsg-segment-box">
            <div class="rsg-segment-toolbar">
              <span class="rsg-group-title">Board Segment</span>
              <button type="button" id="rsgFitBoards">Match boards</button>
              <button type="button" id="rsgResetStart">Reset start</button>
              <button type="button" id="rsgApply" class="rsg-primary">Apply to boards</button>
            </div>
            <div class="rsg-segment-timeline" id="rsgSegmentTimeline">
              <div class="rsg-segment-rail"></div>
              <div id="rsgSegmentLayer"></div>
              <div class="rsg-segment-playhead" id="rsgPlayhead"></div>
            </div>
            <div id="rsgSegmentSummary" class="rsg-segment-summary">Segments: none</div>
          </div>
          <div id="rsgBoardMeta" class="rsg-board-meta"></div>
        </div>
      </section>
    </div>
    <input
      id="rsgReferenceFile"
      type="file"
      accept="image/*,video/*,.glb,.gltf,.png,.jpg,.jpeg,.tif,.tiff,.webp,.mp4,.mov,.webm,.mkv,.avi,.m4v"
      hidden
    />
    <div id="rsgToast" class="rsg-toast" hidden></div>
    <script src="/static/reference_media.js"></script>
    <script src="/static/reference_preview.js"></script>
    <script type="module" src="/static/reference_model_preview.js"></script>
    <script type="module" src="/static/ref_segment_window.js"></script>
  </body>
</html>
