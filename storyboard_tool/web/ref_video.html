<!doctype html>
<html lang="en" data-theme="studio">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/static/favicon.ico" sizes="any" />
    <script>
      (function () {
        var themes = ["studio", "cinema", "paper", "slate", "noir"];
        try {
          var stored = localStorage.getItem("storyboard_ui_theme") || "studio";
          if (themes.indexOf(stored) >= 0) document.documentElement.setAttribute("data-theme", stored);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "studio");
        }
      })();
    </script>
    <link rel="stylesheet" href="/static/themes.css" />
    <link rel="stylesheet" href="/static/reference_media.css" />
    <link rel="stylesheet" href="/static/ref_video_window.css" />
  </head>
  <body class="rv-app">
    <div class="rv-layout">
      <aside id="rvReferencesPanel" class="rv-references-panel"></aside>
      <section class="rv-panel">
        <div class="rv-panel-header">
          <span>Segment</span>
          <span id="rvVideoMeta" class="rv-status">Loading…</span>
        </div>
        <div class="rv-panel-body rv-video-panel">
          <div class="rv-video-stage">
            <video id="rvVideo" preload="metadata" playsinline></video>
            <div id="rvVideoEmpty" class="rv-video-empty" hidden>Select or import a reference video from the left panel.</div>
          </div>
          <input id="rvScrubber" class="rv-scrubber" type="range" min="0" max="0" step="0.001" value="0" aria-label="Video progress" />
          <div class="rv-segment-box">
            <div class="rv-segment-toolbar">
              <span class="rv-group-title">Board Segment</span>
              <button type="button" id="rvFitBoards">Match boards</button>
              <button type="button" id="rvResetStart">Reset start</button>
              <button type="button" id="rvApply" class="rv-primary">Apply to boards</button>
            </div>
            <div class="rv-segment-timeline" id="rvSegmentTimeline">
              <div class="rv-segment-rail"></div>
              <div id="rvSegmentLayer"></div>
              <div class="rv-segment-playhead" id="rvPlayhead"></div>
            </div>
            <div id="rvSegmentSummary" class="rv-segment-summary">Segments: none</div>
          </div>
          <div id="rvBoardMeta" class="rv-board-meta"></div>
        </div>
      </section>
    </div>
    <input
      id="rvReferenceFile"
      type="file"
      accept="image/*,video/*,.glb,.gltf,.png,.jpg,.jpeg,.tif,.tiff,.webp,.mp4,.mov,.webm,.mkv,.avi,.m4v"
      hidden
    />
    <div id="rvToast" class="rv-toast" hidden></div>
    <script src="/static/reference_media.js"></script>
    <script src="/static/reference_preview.js"></script>
    <script type="module" src="/static/reference_model_preview.js"></script>
    <script src="/static/ref_video_window.js"></script>
  </body>
</html>
