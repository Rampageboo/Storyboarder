commands:
  - "python main.py - run the desktop window; do not open the URL in a browser"
  - "python scripts/verify_dev.py - full validation gate, required before merging"
  - "python scripts/verify_dev.py --backend | --frontend | --fast"
  - "python -m pytest tests/ - full backend suite"
  - "python -m pytest tests/test_smoke.py - fast subset"
  - "cd frontend && npm.cmd run lint - Windows needs npm.cmd"
  - "cd frontend && npm.cmd run build - tsc -b, vite build, build:workspace"
versions:
  - "Python 3.11+; dependencies in requirements.txt; .venv/ exists in-repo"
  - "React 19 + TypeScript, built with Vite"
  - "pywebview 6.2.1 (window.events.closing verified present)"
identifiers:
  - "storyboard_live_bridge.json - Photoshop bridge file name, part of the frozen plugin contract"
  - ".storyboarder-session.json - work-tree marker, excluded from the pack"
active_exact_constraints:
  - "There is no CI. verify_dev.py is the gate and runs locally."
  - "npm run lint is red at a known baseline on main; compare, do not expect green."
  - "Rebuild and commit storyboard_tool/web/dist/** after editing frontend/src/**."
  - "Stop background loops before deleting any work tree."
