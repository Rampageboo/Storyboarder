  - "storyboard_tool/backend_service.py - StoryboardBackendService, single business-logic entry"
  - "frontend/src/ - React/TS source; built bundle committed to storyboard_tool/web/dist/"
  - "photoshop_uxp_plugin/ - UXP plugin, vanilla JS"
